          <div class="card-front">
            <h2 class="valentine-title">Make Someone's Day!</h2>
            <div class="card-image-container"></div>
            <div class="valentine-message">Click generate to create a special Valentine's Day card!</div>
            <div class="valentine-type">Waiting for your touch...</div>
          </div>
          <div class="card-back">
            <div class="card-back-design">

                <path d="M50,20 A20,20 0 0,1 70,40 L50,60 L30,40 A20,20 0 0,1 50,20z" fill="currentColor"/>
              </svg>
              <div class="card-back-pattern"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button id="printBtn" class="print-btn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

    </button>
  </div>
